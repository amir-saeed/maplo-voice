[project]
name = "maplo-voice"
version = "0.1.0"
description = "Voice agent: FastAPI + WebSocket + OpenAI ASR/LLM/TTS + pgvector RAG + OpenTelemetry"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.142.2,<0.143",
    "uvicorn[standard]>=0.54.0,<0.55",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "sqlalchemy[asyncio]>=2.1.3,<2.2",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.0,<2",
    "pgvector>=0.5.0,<0.6",
    "openai>=3.26.0,<4",
    "numpy>=2.5.3,<3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4,<10",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1,<2",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
]

[project.scripts]
maplo-voice = "maplo_voice.main:run"

[tool.poetry]
packages = [{ include = "maplo_voice", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
respx = "^0.23.1"
httpx = "^0.28.1"
websockets = "^17.2"
mypy = "^2.4.0"
ruff = "^0.16.10"
pre-commit = "^4.6.2"

[tool.poetry.group.analytics]
optional = true

[tool.poetry.group.analytics.dependencies]
pandas = "^3.0.6"
jupyterlab = "^4.6.4"
matplotlib = "*"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- tooling
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "TC", "PL"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "maplo_voice.db.models.Base",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106", "PLR0911", "PLC0415"]
"migrations/**" = ["N999"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pgvector.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --cov=maplo_voice --cov-report=term-missing"
markers = ["integration: requires a running PostgreSQL (docker compose up db)"]

[tool.coverage.run]
branch = true
source = ["src/maplo_voice"]
